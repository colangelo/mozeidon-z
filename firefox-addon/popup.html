<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 264px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: #1c1b22;
        color: #fbfbfe;
      }
      .card {
        padding: 20px 18px 14px;
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 13px;
      }
      .name {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.2px;
        margin: 11px 0 3px;
      }
      .version {
        font-size: 12px;
        color: #a9a7b3;
        font-variant-numeric: tabular-nums;
      }
      .tagline {
        font-size: 12px;
        color: #cfcdd6;
        line-height: 1.45;
        margin: 9px 4px 0;
      }
      .links {
        display: flex;
        gap: 8px;
        margin-top: 15px;
      }
      .links a {
        flex: 1;
        text-decoration: none;
        font-size: 12px;
        font-weight: 500;
        padding: 8px 0;
        border-radius: 8px;
        background: #2b2a33;
        color: #fbfbfe;
        border: 1px solid #3a3945;
        transition: background 0.12s ease;
      }
      .links a:hover {
        background: #38373f;
      }
      .foot {
        font-size: 10px;
        color: #75737e;
        margin-top: 13px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="icons/mazinger-Z-128.png" alt="Mozeidon-Z" />
      <div class="name">Mozeidon-Z</div>
      <div class="version" id="version">v…</div>
      <div class="tagline" id="tagline">
        Control Firefox from the terminal — tabs, bookmarks, history &amp; groups.
      </div>
      <div class="links">
        <a id="amo" target="_blank" rel="noreferrer">Add-on page</a>
        <a id="repo" target="_blank" rel="noreferrer">GitHub</a>
      </div>
      <div class="foot" id="foot"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
