name: Release

# Mozeidon-Z CLI release: tag v* → build, sign, publish to GitHub Releases, and
# bump the Homebrew formula in colangelo/homebrew-tap. (HittyPing pattern.)
# NOTE: Gitea Actions must be DISABLED for this repo so it doesn't also try to run
# this workflow on the internal mirror. Push v* tags to the GitHub `origin` remote.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v5.0.2)'
        required: true
        type: string

permissions: read-all

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 'stable'
      - name: Build & test
        run: cd cli && go build ./... && go test ./...

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 'stable'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: cd cli && go build -ldflags="-s -w" -o ../mozeidon-z-${{ matrix.goos }}-${{ matrix.goarch }} .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mozeidon-z-*
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-*
          merge-multiple: true
      - run: ls -la mozeidon-z-*
      - name: Generate checksums
        run: sha256sum mozeidon-z-* > checksums.txt && cat checksums.txt
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign with cosign (keyless)
        run: |
          for file in mozeidon-z-*; do
            cosign sign-blob --yes --output-signature "${file}.sig" --output-certificate "${file}.pem" "${file}"
          done
          cosign sign-blob --yes --output-signature checksums.txt.sig --output-certificate checksums.txt.pem checksums.txt
      - name: Upload release assets
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          name: ${{ env.RELEASE_TAG }}
          files: |
            mozeidon-z-*
            checksums.txt
            checksums.txt.sig
            checksums.txt.pem
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # base64 of Formula/mozeidon-z.rb template with PLACEHOLDERs (avoids YAML/heredoc issues)
      FORMULA_B64: 
    steps:
      - name: Calculate checksums
        run: |
          VERSION="${RELEASE_TAG#v}"
          BASE_URL="https://github.com/colangelo/mozeidon-z/releases/download/${RELEASE_TAG}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          for t in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            curl -sL "${BASE_URL}/mozeidon-z-${t}" | sha256sum | cut -d' ' -f1 > "${t}.sha"
          done
      - name: Update homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/colangelo/homebrew-tap.git
          cd homebrew-tap
          echo "$FORMULA_B64" | base64 -d > Formula/mozeidon-z.rb
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" Formula/mozeidon-z.rb
          sed -i "s/DARWIN_ARM64_PLACEHOLDER/$(cat ../darwin-arm64.sha)/" Formula/mozeidon-z.rb
          sed -i "s/DARWIN_AMD64_PLACEHOLDER/$(cat ../darwin-amd64.sha)/" Formula/mozeidon-z.rb
          sed -i "s/LINUX_ARM64_PLACEHOLDER/$(cat ../linux-arm64.sha)/" Formula/mozeidon-z.rb
          sed -i "s/LINUX_AMD64_PLACEHOLDER/$(cat ../linux-amd64.sha)/" Formula/mozeidon-z.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mozeidon-z.rb
          git diff --staged --quiet || git commit -m "Update mozeidon-z to v${VERSION}"
          git push
