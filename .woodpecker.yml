# Woodpecker CI for Mozeidon-Z — build verification only (push/PR/manual).
# Releases are handled by GitHub Actions (.github/workflows/release.yml → public
# GitHub Releases + Homebrew tap). Mirrors `just build-all`; Raycast is excluded
# (its `ray build` needs the Raycast toolchain). Each step sets depends_on so the
# DAG is explicit; the three builds run in parallel.

steps:
  - name: build-cli
    image: golang:1.24
    depends_on: []
    when:
      - event: [push, pull_request, manual]
    commands:
      - cd cli && go build -o mozeidon-z

  - name: build-firefox
    image: node:20
    depends_on: []
    when:
      - event: [push, pull_request, manual]
    commands:
      - cd firefox-addon && npm ci && npm run build

  # chrome-addon/src/ is gitignored and synced verbatim from firefox-addon (== just build-chrome)
  - name: build-chrome
    image: node:20
    depends_on: []
    when:
      - event: [push, pull_request, manual]
    commands:
      - rm -rf chrome-addon/src
      - cp -r firefox-addon/src chrome-addon/src
      - cd chrome-addon && npm ci && npm run build
